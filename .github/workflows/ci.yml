name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up SSH tunnel to k3s API server
        env:
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          K3S_HOST: ${{ secrets.K3S_HOST }}
        run: |
          echo "$CI_DEPLOY_SSH_KEY" > /tmp/ci_deploy_key
          chmod 600 /tmp/ci_deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/ci_deploy_key \
            -L 16443:127.0.0.1:6443 -N "ci-deploy@$K3S_HOST" &
          sleep 2

      - name: Set k8s context
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes with Helm
        run: |
          helm upgrade --install inbucket . --atomic --values values.yaml \
            --set "authenticatedEmails[0]=${{ secrets.OAUTH2_PROXY_AUTHENTICATED_EMAIL }}" \
            --set "oauth2Proxy.clientId=${{ secrets.OAUTH2_PROXY_CLIENT_ID }}" \
            --set "oauth2Proxy.clientSecret=${{ secrets.OAUTH2_PROXY_CLIENT_SECRET }}" \
            --set "oauth2Proxy.cookieSecret=${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}"
