inbucketImage:
  repository: inbucket/inbucket
  tag: 3.0.4
  pullPolicy: IfNotPresent

oauth2ProxyImage:
  repository: quay.io/oauth2-proxy/oauth2-proxy
  tag: v7.9.0

oauth2Proxy:
  clientId: ""
  clientSecret: ""
  cookieSecret: ""

authenticatedEmails: []

service:
  port:
    http: 4180
    smtp: 25
    pop3: 1100

extraEnv:
  INBUCKET_SMTP_ACCEPTDOMAINS: "morjoff.com"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-inbucket-redirect@kubernetescrd
  hosts:
    - host: inbucket.morjoff.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inbucket.morjoff.com
      hosts:
        - inbucket.morjoff.com
